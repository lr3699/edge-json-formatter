<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>粘贴 JSON 格式化 · JSON Formatter</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 4H7.5A2.5 2.5 0 0 0 5 6.5v3A2.5 2.5 0 0 1 2.5 12 2.5 2.5 0 0 1 5 14.5v3A2.5 2.5 0 0 0 7.5 20H9"/>
          <path d="M15 4h1.5A2.5 2.5 0 0 1 19 6.5v3A2.5 2.5 0 0 0 21.5 12 2.5 2.5 0 0 0 19 14.5v3A2.5 2.5 0 0 1 16.5 20H15"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>JSON Formatter</b>
        <em>粘贴即格式化</em>
      </span>
    </div>
    <div class="topbar-tools">
      <span id="keys" class="keys">
        <kbd>Ctrl</kbd><i>+</i><kbd>Enter</kbd><i>立即格式化</i>
        <em class="keys-sep">·</em>
        <kbd>F</kbd><i>全屏</i>
      </span>
      <button id="btnSolo" class="btn btn-ghost panel-solo-toggle" type="button"
              aria-pressed="false" title="收起 / 展开左侧输入栏，把宽度让给 JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2.5"/>
          <line x1="9.5" y1="4.5" x2="9.5" y2="19.5"/>
        </svg>
        <span id="soloLabel">输入栏</span>
      </button>
      <button id="btnFullscreen" class="btn btn-ghost" type="button"
              aria-pressed="false" title="全屏查看（F）">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
        </svg>
        <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 4v3a2 2 0 0 1-2 2H4"/>
          <path d="M15 4v3a2 2 0 0 0 2 2h3"/>
          <path d="M15 20v-3a2 2 0 0 1 2-2h3"/>
          <path d="M9 20v-3a2 2 0 0 0-2-2H4"/>
        </svg>
        <span id="fsLabel">全屏</span>
      </button>
      <button id="btnOptions" class="btn btn-ghost" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>设置</span>
      </button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="panel panel-input" id="panelInput">
      <header class="panel-head">
        <span class="panel-title">
          <span class="dot-i dot-in"></span>输入
        </span>
        <span class="panel-tools">
          <button id="btnUniToggle" class="btn btn-sm" type="button"
                  title="中文 ⇄ \uXXXX 自动识别方向：内容含 \u 转义则还原成中文，否则把中文转成 \uXXXX">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span>中文⇄U</span>
          </button>
          <button id="btnEscToggle" class="btn btn-sm" type="button"
                  title="转义 ⇄ 还原 自动识别方向：整段是带引号的转义字符串则还原，否则转义成 JSON 字符串">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
            <span>转义⇄还原</span>
          </button>
          <button id="btnMinify" class="btn btn-sm" type="button"
                  title="压缩：去掉多余空白与注释（单遍扫描，大整数精度不丢）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="4 14 10 14 10 20"/>
              <polyline points="20 10 14 10 14 4"/>
              <line x1="14" y1="10" x2="21" y2="3"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            <span>压缩</span>
          </button>
          <span class="tools-sep"></span>
          <button id="btnSample" class="btn btn-sm" type="button" title="载入示例数据">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/>
              <path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/>
            </svg>
            <span>示例</span>
          </button>
          <button id="btnClear" class="btn btn-sm" type="button" title="清空输入与结果">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            <span>清空</span>
          </button>
        </span>
      </header>
      <div class="editor-wrap">
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  placeholder="把 JSON 粘贴到这里…&#10;&#10;· Ctrl+V / ⌘V 直接粘贴&#10;· 或把 .json / .txt 文件拖进来&#10;· 支持带注释、单引号、尾随逗号的宽松写法"></textarea>
        <div id="rawView" class="raw-view" hidden>
          <div id="rawSizer" class="raw-sizer"></div>
          <div id="rawContent" class="raw-content"></div>
        </div>
      </div>
      <footer class="panel-foot">
        <span id="stats" class="muted">0 字符</span>
        <span class="muted" id="fileInfo"></span>
      </footer>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
         tabindex="0" title="拖动调整左右宽度（双击恢复默认）">
      <span class="splitter-grip"></span>
    </div>

    <section class="panel panel-output" id="panelOutput">
      <div id="viewer" class="viewer-host" hidden></div>
      <!-- 大文档视图（CodeMirror 6 虚拟化）：文本超阈值时用它替代树视图 -->
      <div id="bigView" class="viewer-host big-view" hidden></div>
      <div id="welcome" class="welcome">
        <div class="welcome-art">
          <svg viewBox="0 0 120 96" fill="none" aria-hidden="true">
            <rect x="10" y="14" width="100" height="68" rx="10"
                  stroke="currentColor" stroke-width="2" opacity=".35"/>
            <path d="M22 34h18M22 46h34M22 58h26" stroke="currentColor" stroke-width="2.4"
                  stroke-linecap="round" opacity=".55"/>
            <path d="M74 32l8 8-8 8" stroke="currentColor" stroke-width="2.4"
                  stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
            <circle cx="60" cy="76" r="3" fill="currentColor" opacity=".5"/>
          </svg>
        </div>
        <h2>等待粘贴</h2>
        <p>左侧贴入一段 JSON，这里会实时渲染成可折叠、带语法高亮的树。</p>
        <ul class="welcome-list">
          <li>解析失败会标出行号、列号与出错位置</li>
          <li>大整数按原文保留，精度不丢失</li>
          <li>可搜索、可折叠、可复制路径、可导出</li>
        </ul>
      </div>
      <footer class="panel-foot panel-foot-output">
        <span id="statusPill" class="pill">
          <span class="pill-dot"></span><span id="pillText">就绪</span>
        </span>
        <span id="msg" class="msg"></span>
      </footer>
    </section>
  </main>

  <script src="../vendor/codemirror.bundle.js"></script>
  <script src="../shared/defaults.js"></script>
  <script src="../content/json-parser.js"></script>
  <script src="../content/viewer.js"></script>
  <script src="../content/bigview.js"></script>
  <script src="editor.js"></script>
</body>
</html>
